name: 'BCR Gemini PR Reviewer'
description: 'Prepares BCR PR context, runs Gemini CLI review, and cleans up dangling pending reviews.'

inputs:
  github_token:
    description: 'GitHub token used to read PR metadata and post review comments'
    required: true
  pr_number:
    description: 'Pull request number to review'
    required: true
  additional_context:
    description: 'Optional focus or instructions for the review'
    required: false
    default: ''
  gcp_workload_identity_provider:
    description: 'Google Cloud Workload Identity Provider'
    required: false
    default: ''
  gcp_service_account:
    description: 'Google Cloud Service Account email'
    required: false
    default: ''
  gcp_project_id:
    description: 'Google Cloud project ID'
    required: false
    default: 'bazel-public'
  gcp_location:
    description: 'Google Cloud location'
    required: false
    default: 'global'
  gemini_model:
    description: 'Gemini model name'
    required: false
    default: 'gemini-4-argon'
  gemini_cli_version:
    description: 'Gemini CLI version to install'
    required: false
    default: ''
  gemini_debug:
    description: 'Enable Gemini CLI debug logging'
    required: false
    default: 'false'
  gemini_api_key:
    description: 'Optional Gemini API key (if not using Vertex AI WIF)'
    required: false
    default: ''
  google_api_key:
    description: 'Optional Vertex AI API key (if not using Vertex AI WIF)'
    required: false
    default: ''
  use_gemini_code_assist:
    description: 'Whether to use Gemini Code Assist endpoint'
    required: false
    default: 'false'
  use_vertex_ai:
    description: 'Whether to use Vertex AI endpoint'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Acknowledge manual comment request
      if: github.event_name == 'issue_comment'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ github.repository }}
        COMMENT_ID: ${{ github.event.comment.id }}
      run: |-
        gh api "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
          -f content='eyes' || true

    - name: Prepare BCR review context
      id: prepare_context
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ inputs.pr_number }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        INPUT_CONTEXT: ${{ inputs.additional_context }}
      run: python3 "${{ github.action_path }}/prepare_context.py"

    - name: Run Gemini pull request review
      if: steps.prepare_context.outputs.should_run == 'true'
      uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
      id: gemini_pr_review
      env:
        GEMINI_CLI_TRUST_WORKSPACE: 'true'
        GITHUB_TOKEN: ${{ inputs.github_token }}
      with:
        gcp_location: ${{ inputs.gcp_location }}
        gcp_project_id: ${{ inputs.gcp_project_id }}
        gcp_service_account: ${{ inputs.gcp_service_account }}
        gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        gemini_api_key: ${{ inputs.gemini_api_key }}
        gemini_cli_version: ${{ inputs.gemini_cli_version }}
        gemini_debug: ${{ inputs.gemini_debug }}
        gemini_model: ${{ inputs.gemini_model }}
        google_api_key: ${{ inputs.google_api_key }}
        use_gemini_code_assist: ${{ inputs.use_gemini_code_assist }}
        use_vertex_ai: ${{ inputs.use_vertex_ai }}
        workflow_name: 'bcr-gemini-review'
        github_pr_number: ${{ steps.prepare_context.outputs.pr_number }}
        settings: |-
          {
            "model": {
              "maxSessionTurns": 50
            },
            "telemetry": {
              "enabled": false,
              "target": "gcp"
            },
            "mcpServers": {
              "github": {
                "command": "docker",
                "args": [
                  "run",
                  "-i",
                  "--rm",
                  "-e",
                  "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "ghcr.io/github/github-mcp-server:v0.27.0"
                ],
                "includeTools": [
                  "add_comment_to_pending_review",
                  "get_commit",
                  "get_file_contents",
                  "issue_read",
                  "pull_request_read",
                  "pull_request_review_write",
                  "search_code"
                ],
                "env": {
                  "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                }
              }
            },
            "tools": {
              "core": [
                "read_file",
                "glob",
                "grep_search",
                "list_directory"
              ]
            }
          }
        # Named bcr-review rather than gemini-review because run-gemini-cli copies
        # its own default commands (including gemini-review.toml) into .gemini/commands/.
        prompt: '/bcr-review'

    - name: Cleanup any dangling pending review
      if: always() && steps.prepare_context.outputs.should_run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.prepare_context.outputs.pr_number }}
      run: |-
        PENDING_IDS=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '.[] | select(.state == "PENDING") | .id' || true)
        for review_id in ${PENDING_IDS}; do
          echo "Deleting dangling PENDING review ${review_id}..."
          gh api -X DELETE "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review_id}" || true
        done
